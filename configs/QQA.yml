# iSCO - Quick test configuration (fast, for correctness checking)
isco:
  solver_name: "isco"
  params:
    batch_size: 8
    chain_length: 1000
    init_temperature: 1.5
    final_temperature: 0.01
    decay_rate: 0.15
    t_schedule: "exp_decay"
    num_flips: 1
    adaptive: true
    target_acceptance_rate: 0.574
    balancing_fn_type: "SQRT"
    approx_with_grad: true
    log_every_steps: 200
    save_samples: false


