# QQA (Quasi-Quantum Annealing) Solver Parameters:
#   sol_size (S): Number of parallel solutions in the batch (more = better exploration, slower)
#   learning_rate: Learning rate for gradient updates (controls step size)
#   temp (T): Temperature for Langevin noise injection (higher = more exploration)
#   min_bg (γ_min), max_bg (γ_max): Background field range for annealing schedule (controls penalty strength)
#   curve_rate (α): Penalty curve rate - MUST be an integer (non-integer causes NaN when x > 0.5)
#   div_param: Diversity parameter (0-1, higher = more diversity in solutions)
#   num_epochs: Total number of annealing iterations
#   check_interval: Frequency of internal logging
#   plot_dynamics: Whether to plot energy curves during optimization
#   device: Device to use ('cpu', 'cuda', or null for auto-detect)

QQA:
  solver_name: "qqa"
  params:
    sol_size: 100          # configuración de referencia del README del paper
    learning_rate: 1.0
    temp: 0.001
    min_bg: -3.0
    max_bg: 0.1
    curve_rate: 4.0
    div_param: 0.2
    num_epochs: 3000
    check_interval: 500
    plot_dynamics: false
    device: null

